---
- name: Ensure swapfile
  block:
    - name: Check if swapfile is active
      ansible.builtin.command:
        cmd: swapon --show=NAME --noheadings
      register: swapon_show
      changed_when: false

    - name: Check current swapfile
      ansible.builtin.stat:
        path: /swapfile
        get_checksum: false
      register: swapfile_stat

    - name: Determine if swapfile needs (re)creation
      ansible.builtin.set_fact:
        swapfile_needs_resize: >-
          {{ not swapfile_stat.stat.exists
             or swapfile_stat.stat.size != (swapfile_size | human_to_bytes) }}

    - name: Gather service facts
      ansible.builtin.service_facts:
      when: swapfile_needs_resize

    - name: Get list of running docker containers
      ansible.builtin.command:
        cmd: docker ps -q
      register: docker_running_containers
      changed_when: false
      when:
        - swapfile_needs_resize
        - "'docker.service' in ansible_facts.services"
        - ansible_facts.services['docker.service'].state == 'running'

    - name: Stop running docker containers before swap changes
      ansible.builtin.command:
        cmd: "docker stop {{ docker_running_containers.stdout_lines | join(' ') }}"
      when:
        - swapfile_needs_resize
        - docker_running_containers.stdout_lines is defined
        - docker_running_containers.stdout_lines | length > 0

    - name: Disable swapfile before resizing
      ansible.builtin.command:
        cmd: swapoff /swapfile
      when:
        - "'/swapfile' in swapon_show.stdout_lines"
        - swapfile_needs_resize

    - name: Allocate swapfile
      ansible.builtin.command:
        cmd: fallocate -l {{ swapfile_size }} /swapfile
      when: swapfile_needs_resize

    - name: Set swapfile permissions
      ansible.builtin.file:
        path: /swapfile
        mode: '0600'
        owner: root
        group: root
      when: swapfile_needs_resize

    - name: Initialize swapfile
      ansible.builtin.command:
        cmd: mkswap /swapfile
      when: swapfile_needs_resize

    - name: Check swapfile active state after changes
      ansible.builtin.command:
        cmd: swapon --show=NAME --noheadings
      register: swapon_show_after
      changed_when: false

    - name: Enable swapfile
      ansible.builtin.command:
        cmd: swapon /swapfile
      when: "'/swapfile' not in swapon_show_after.stdout_lines"

    - name: Start previously running docker containers
      ansible.builtin.command:
        cmd: "docker start {{ docker_running_containers.stdout_lines | join(' ') }}"
      when:
        - swapfile_needs_resize
        - docker_running_containers.stdout_lines is defined
        - docker_running_containers.stdout_lines | length > 0

    - name: Ensure swapfile is in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^/swapfile\s+'
        line: '/swapfile none swap sw 0 0'
        state: present

- name: Set vm.swappiness
  ansible.builtin.sysctl:
    name: vm.swappiness
    value: '30'
    state: present
    sysctl_set: true
    sysctl_file: /etc/sysctl.d/60-swappiness.conf
    reload: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install certbot and docker.io
  ansible.builtin.apt:
    name:
      - certbot
      - docker.io
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Ensure docker is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Install docker-compose binary
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-{{ ansible_system | lower }}-{{ ansible_architecture }}"
    dest: /usr/local/bin/docker-compose
    mode: '0755'
    force: false

- name: Create UNA directory tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ una_root }}"
    - "{{ una_root }}/neo"
    - "{{ una_root }}/cnf/grafana/dashboards"
    - "{{ una_root }}/cnf/grafana/provisioning/dashboards"
    - "{{ una_root }}/cnf/grafana/provisioning/datasources"
    - "{{ una_root }}/www/html"

- name: Set www ownership for UNA container user
  ansible.builtin.file:
    path: "{{ una_root }}/www"
    state: directory
    owner: '2483'
    group: '2483'
    recurse: true

- name: Ensure db_dump.sql exists
  ansible.builtin.file:
    path: "{{ una_root }}/cnf/db_dump.sql"
    state: touch
    mode: '0644'
    modification_time: preserve
    access_time: preserve