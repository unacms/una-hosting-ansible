global:
  scrape_interval: 60s
  scrape_timeout: 10s

scrape_configs:
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_memory_usage_bytes|container_spec_memory_limit_bytes|container_fs_usage_bytes
