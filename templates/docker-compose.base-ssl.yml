services:
    traefik:
        image: traefik:v3.7
        labels:
            - "traefik.enable=true"

            # Enable self‑routing
            - "traefik.enable=true"

            # Dashboard router
            - "traefik.http.routers.traefik-dashboard.rule=Host(`{{ host }}`) && PathPrefix(`/traefik`)"
            - "traefik.http.routers.traefik-dashboard.service=api@internal"
            - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
            - "traefik.http.routers.traefik-dashboard.tls=true"

            # Basic‑auth middleware (TODO: use UNA studio pwd)
            - "traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$apr1$$yhaWa.pm$$qX6ZBO48oAcEyDYNkT1cb/"
            - "traefik.http.routers.traefik-dashboard.middlewares=dashboard-auth@docker"
        restart: always
        ports:
            - "80:80"
            - "443:443"
        networks:
            - proxy
        volumes:
            - ./letsencrypt:/letsencrypt
            - /var/run/docker.sock:/var/run/docker.sock
        command:
            # Providers 
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--providers.docker.network=una_proxy"

            # EntryPoints
            - "--entrypoints.web.address=:80"
            - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
            - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
            - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

            - "--entrypoints.websecure.address=:443"
            - "--entrypoints.websecure.http.tls=true"
            - "--entrypoints.websecure.http.tls.certresolver=le"

            # Let's encrypt
            - "--certificatesresolvers.le.acme.email=hosting@unacms.com"
            - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
            - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"            

            # API & Dashboard 
            - "--api.basePath=/traefik"
            - "--api.dashboard=true"
            - "--api.insecure=false"

            # Observability 
            - "--log.level=INFO"
            - "--accesslog=true"
            - "--metrics.prometheus=true"

secrets:
  mysql_root_password:
    file: .sec_mysql_root_password
  mysql_una_password:
    file: .sec_mysql_una_password
  grafana_password:
    file: .sec_grafana_password

volumes:
  mysqldata: {}

networks:
  proxy:
  external:
  internal:
    internal: true